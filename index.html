<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.C. Boundary Stone Locations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Code+Pro:wght@400;500&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --parchment: #f5f0e8;
    --parchment-dark: #e8e0ce;
    --ink: #1a1410;
    --ink-light: #3d332a;
    --copper: #b8793a;
    --copper-light: #d4954f;
    --copper-pale: #f0dfc0;
    --verdigris: #4a7c6f;
    --verdigris-light: #6aad9b;
    --red-seal: #8b2020;
    --sidebar-width: 340px;
    --header-height: 64px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Crimson Pro', Georgia, serif;
    background: var(--ink);
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    height: var(--header-height);
    background: var(--ink);
    border-bottom: 2px solid var(--copper);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 1000;
  }

  .header-emblem {
    width: 38px; height: 38px;
    border: 2px solid var(--copper);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: var(--copper);
    flex-shrink: 0;
    background: rgba(184,121,58,0.08);
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--parchment);
    letter-spacing: 0.02em;
    flex: 1;
  }
  header h1 span {
    color: var(--copper);
  }

  .header-meta {
    font-family: 'Source Code Pro', monospace;
    font-size: 0.65rem;
    color: #8a7a68;
    text-align: right;
    line-height: 1.5;
  }

  /* ── MAIN LAYOUT ── */
  .layout {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--parchment);
    display: flex;
    flex-direction: column;
    transition: width 0.3s ease, transform 0.3s ease;
    position: relative;
    z-index: 500;
    border-right: 1px solid var(--parchment-dark);
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar.collapsed {
    width: 0;
  }

  .sidebar-toggle {
    position: absolute;
    left: var(--sidebar-width);
    top: 50%;
    transform: translateY(-50%);
    z-index: 600;
    background: var(--ink);
    border: 2px solid var(--copper);
    border-left: none;
    color: var(--copper);
    width: 22px; height: 52px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: 0 6px 6px 0;
    transition: left 0.3s ease;
    font-size: 10px;
  }
  .sidebar-toggle:hover { background: #2a2018; }
  .sidebar.collapsed + .sidebar-toggle {
    left: 0;
  }

  /* ── SIDEBAR HEADER ── */
  .sidebar-head {
    background: var(--ink);
    padding: 16px 16px 14px;
    border-bottom: 2px solid var(--copper);
  }

  .sidebar-title {
    font-family: 'Playfair Display', serif;
    font-size: 0.85rem;
    color: var(--copper-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* ── SEARCH ── */
  .search-wrapper {
    position: relative;
  }
  .search-input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid #4a3c2e;
    border-radius: 4px;
    padding: 8px 32px 8px 12px;
    font-family: 'Crimson Pro', serif;
    font-size: 0.95rem;
    color: var(--parchment);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input::placeholder { color: #6a5a48; }
  .search-input:focus { border-color: var(--copper); }
  .search-icon {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    color: #6a5a48;
    font-size: 13px;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--copper);
    font-size: 13px;
    cursor: pointer;
    display: none;
    background: none; border: none;
    line-height: 1;
  }

  /* ── FILTER PILLS ── */
  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 10px 16px 0;
    background: var(--ink);
    padding-bottom: 12px;
  }
  .pill {
    font-family: 'Source Code Pro', monospace;
    font-size: 0.62rem;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid currentColor;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .pill-all { color: var(--parchment); border-color: #5a4a38; }
  .pill-all.active { background: #5a4a38; color: var(--parchment); }
  .pill-nw { color: #7ac; border-color: #7ac; }
  .pill-nw.active { background: #7ac; color: var(--ink); }
  .pill-ne { color: #fa8; border-color: #fa8; }
  .pill-ne.active { background: #fa8; color: var(--ink); }
  .pill-sw { color: #8d8; border-color: #8d8; }
  .pill-sw.active { background: #8d8; color: var(--ink); }
  .pill-se { color: #d8a; border-color: #d8a; }
  .pill-se.active { background: #d8a; color: var(--ink); }
  .pill-cardinal { color: var(--copper-light); border-color: var(--copper-light); }
  .pill-cardinal.active { background: var(--copper-light); color: var(--ink); }

  /* ── STONE COUNT ── */
  .stone-count {
    padding: 8px 16px;
    font-family: 'Source Code Pro', monospace;
    font-size: 0.65rem;
    color: #7a6a58;
    background: var(--parchment-dark);
    border-bottom: 1px solid #d8ccb8;
    letter-spacing: 0.05em;
  }

  /* ── STONE LIST ── */
  .stone-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .stone-list::-webkit-scrollbar { width: 5px; }
  .stone-list::-webkit-scrollbar-track { background: var(--parchment); }
  .stone-list::-webkit-scrollbar-thumb { background: var(--copper-pale); border-radius: 3px; }

  .stone-item {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid rgba(184,121,58,0.15);
    transition: background 0.15s;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .stone-item:hover { background: var(--copper-pale); }
  .stone-item.active { background: rgba(184,121,58,0.18); border-left: 3px solid var(--copper); }

  .stone-badge {
    font-family: 'Source Code Pro', monospace;
    font-size: 0.62rem;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 3px;
    flex-shrink: 0;
    min-width: 48px;
    text-align: center;
    margin-top: 2px;
    letter-spacing: 0.04em;
  }
  .badge-nw { background: rgba(119,170,204,0.2); color: #4488aa; border: 1px solid rgba(119,170,204,0.5); }
  .badge-ne { background: rgba(255,170,136,0.2); color: #cc6633; border: 1px solid rgba(255,170,136,0.5); }
  .badge-sw { background: rgba(136,221,136,0.2); color: #338833; border: 1px solid rgba(136,221,136,0.5); }
  .badge-se { background: rgba(221,136,187,0.2); color: #993377; border: 1px solid rgba(221,136,187,0.5); }
  .badge-cardinal { background: rgba(184,121,58,0.2); color: var(--copper); border: 1px solid rgba(184,121,58,0.5); }

  .stone-info { flex: 1; min-width: 0; }
  .stone-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .stone-loc {
    font-size: 0.78rem;
    color: #6a5a48;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .no-results {
    padding: 32px 16px;
    text-align: center;
    color: #9a8a78;
    font-style: italic;
    font-size: 0.9rem;
  }

  /* ── MAP ── */
  #map {
    flex: 1;
    background: #2a2218;
  }

  /* ── POPUP ── */
  .leaflet-popup-content-wrapper {
    background: var(--parchment);
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    border: 1px solid var(--copper);
    padding: 0;
    overflow: hidden;
  }
  .leaflet-popup-content {
    margin: 0;
    width: 260px !important;
  }
  .leaflet-popup-tip { background: var(--parchment); }
  .leaflet-popup-close-button { color: var(--ink) !important; top: 8px !important; right: 10px !important; }

  .popup-head {
    background: var(--ink);
    padding: 10px 14px;
    display: flex; gap: 10px; align-items: center;
  }
  .popup-badge {
    font-family: 'Source Code Pro', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.06em;
  }
  .popup-title {
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
    color: var(--parchment);
    font-weight: 600;
  }
  .popup-body { padding: 12px 14px; }
  .popup-desc {
    font-size: 0.82rem;
    color: var(--ink-light);
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .popup-coords {
    font-family: 'Source Code Pro', monospace;
    font-size: 0.65rem;
    color: #8a7a68;
    margin-bottom: 8px;
  }
  .popup-narrative {
    font-size: 0.78rem;
    color: var(--red-seal);
    font-style: italic;
    line-height: 1.4;
    padding: 6px 8px;
    background: rgba(139,32,32,0.07);
    border-left: 2px solid var(--red-seal);
    border-radius: 2px;
    margin-bottom: 8px;
  }
  .popup-link {
    display: inline-block;
    font-family: 'Source Code Pro', monospace;
    font-size: 0.65rem;
    color: var(--copper);
    text-decoration: none;
    letter-spacing: 0.05em;
  }
  .popup-link:hover { color: var(--copper-light); text-decoration: underline; }

  /* ── CUSTOM MARKER ── */
  .stone-marker {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Source Code Pro', monospace;
    font-size: 7px;
    font-weight: 600;
    color: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .stone-marker:hover { transform: scale(1.15); }
  .stone-marker.active-marker { transform: scale(1.25); border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.4); }

  .marker-nw { background: #4488aa; }
  .marker-ne { background: #cc6633; }
  .marker-sw { background: #338833; }
  .marker-se { background: #993377; }
  .marker-cardinal { background: var(--copper); }
</style>
</head>

  <h1>D.C. <span>Boundary Stone</span> Locations</h1>
  <div class="header-meta">

<div class="layout">

      <span class="pill pill-se" onclick="setFilter('SE', this)">SE</span>
      <span class="pill pill-cardinal" onclick="setFilter('CARDINAL', this)">CARDINAL</span>

    <div class="stone-count" id="stoneCount">39 stones · full survey</div>
    <div class="stone-list" id="stoneList"></div>
  </aside>

  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="Toggle sidebar">
    <span id="toggleArrow">◀</span>
  </button>

  <div id="map"></div>
</div>

function getSection(num) {
  if (['NORTH','SOUTH','EAST','WEST'].includes(num)) return 'CARDINAL';
  if (num.startsWith('NW')) return 'NW';
  if (num.startsWith('NE')) return 'NE';
  if (num.startsWith('SW')) return 'SW';
  if (num.startsWith('SE')) return 'SE';
  return 'CARDINAL';
}

function getBadgeClass(section) {
  return { NW:'nw', NE:'ne', SW:'sw', SE:'se', CARDINAL:'cardinal' }[section] || 'cardinal';
}
function getMarkerClass(section) {
  return { NW:'marker-nw', NE:'marker-ne', SW:'marker-sw', SE:'marker-se', CARDINAL:'marker-cardinal' }[section] || 'marker-cardinal';
}

// ── MAP INIT ──
const map = L.map('map', { zoomControl: false }).setView([38.893, -77.04], 11);
L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

// ── MARKERS ──
const markers = {};
let activeId = null;
let currentFilter = 'all';
let currentSearch = '';

STONES.forEach(s => {
  const section = getSection(s.num);
  const mc = getMarkerClass(section);
  const icon = L.divIcon({
    className: '',
    html: `<div class="stone-marker ${mc}" id="mkr-${s.id}">${s.num}</div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -16]
  });

  const badgeCls = getBadgeClass(section);
  const popupHtml = `
    <div class="popup-head">
      <span class="popup-badge badge-${badgeCls}">${s.num}</span>
      <span class="popup-title">Boundary Stone</span>
    </div>
    <div class="popup-body">
      <div class="popup-desc">${s.loc}</div>
      ${s.narrative ? `<div class="popup-narrative">${s.narrative}</div>` : ''}
      <div class="popup-coords">${s.lat.toFixed(6)}°N, ${Math.abs(s.lng).toFixed(6)}°W</div>
      ${s.pic ? `<a class="popup-link" href="${s.pic}" target="_blank">▸ View photograph</a>` : ''}
    </div>`;

  const marker = L.marker([s.lat, s.lng], { icon })
    .addTo(map)
    .bindPopup(popupHtml, { maxWidth: 260, minWidth: 260 });

  marker.on('click', () => selectStone(s.id, false));
  marker.on('popupclose', () => {
    if (activeId === s.id) {
      deselect();
    }
  });
  markers[s.id] = marker;
});

// ── SIDEBAR STATE ──
let sidebarOpen = true;
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
  document.getElementById('toggleArrow').textContent = sidebarOpen ? '◀' : '▶';
  document.getElementById('sidebarToggle').style.left = sidebarOpen ? 'var(--sidebar-width)' : '0';
  setTimeout(() => map.invalidateSize(), 320);
}

// ── FILTER ──
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

// ── SEARCH ──
document.getElementById('searchInput').addEventListener('input', function() {
  currentSearch = this.value.trim().toLowerCase();
  document.getElementById('searchIcon').style.display = currentSearch ? 'none' : '';
  document.getElementById('searchClear').style.display = currentSearch ? '' : 'none';
  renderList();
});

function clearSearch() {
  document.getElementById('searchInput').value = '';
  currentSearch = '';
  document.getElementById('searchIcon').style.display = '';
  document.getElementById('searchClear').style.display = 'none';
  renderList();
}

// ── RENDER LIST ──
function renderList() {
  const list = document.getElementById('stoneList');
  const count = document.getElementById('stoneCount');
  list.innerHTML = '';

  const visible = STONES.filter(s => {
    const sec = getSection(s.num);
    const matchFilter = currentFilter === 'all'
      || (currentFilter === 'CARDINAL' && sec === 'CARDINAL')
      || s.num.startsWith(currentFilter);
    const q = currentSearch;
    const matchSearch = !q || s.num.toLowerCase().includes(q) || s.loc.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  if (visible.length === 0) {
    list.innerHTML = '<div class="no-results">No stones match your search.</div>';
    count.textContent = '0 stones found';
    // hide all markers
    STONES.forEach(s => markers[s.id].setOpacity(0.1));
    return;
  }

  // Update marker visibility
  STONES.forEach(s => {
    const shown = visible.some(v => v.id === s.id);
    markers[s.id].setOpacity(shown ? 1 : 0.15);
  });

  const filterLabel = currentFilter === 'all' ? 'full survey' : currentFilter + ' quadrant';
  count.textContent = `${visible.length} stone${visible.length !== 1 ? 's' : ''} · ${filterLabel}`;

  visible.forEach(s => {
    const section = getSection(s.num);
    const badgeCls = getBadgeClass(section);
    const div = document.createElement('div');
    div.className = 'stone-item' + (activeId === s.id ? ' active' : '');
    div.id = `item-${s.id}`;
    div.innerHTML = `
      <span class="stone-badge badge-${badgeCls}">${s.num}</span>
      <div class="stone-info">
        <div class="stone-name">Boundary Stone ${s.num}</div>
        <div class="stone-loc" title="${s.loc}">${s.loc}</div>
      </div>`;
    div.addEventListener('click', () => selectStone(s.id, true));
    list.appendChild(div);
  });
}

// ── SELECT ──
function selectStone(id, panToMarker) {
  if (activeId !== null) {
    const prev = document.getElementById(`item-${activeId}`);
    if (prev) prev.classList.remove('active');
    const prevEl = document.querySelector(`#mkr-${activeId}`);
    if (prevEl) prevEl.classList.remove('active-marker');
  }
  activeId = id;
  const item = document.getElementById(`item-${id}`);
  if (item) {
    item.classList.add('active');
    item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  const el = document.querySelector(`#mkr-${id}`);
  if (el) el.classList.add('active-marker');

  const stone = STONES.find(s => s.id === id);
  if (panToMarker) {
    map.flyTo([stone.lat, stone.lng], 15, { duration: 0.8 });
  }
  markers[id].openPopup();
}

function deselect() {
  if (activeId !== null) {
    const prev = document.getElementById(`item-${activeId}`);
    if (prev) prev.classList.remove('active');
    const prevEl = document.querySelector(`#mkr-${activeId}`);
    if (prevEl) prevEl.classList.remove('active-marker');
    activeId = null;
  }
}
